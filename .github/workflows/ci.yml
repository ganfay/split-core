name: SplitCore CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.2'
          cache: true

      - name: Run golangci-lint (backend)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ./backend

      - name: Run golangci-lint (notifier)
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ./notifier

      - name: Run Tests (backend)
        working-directory: ./backend
        run: go test -v ./...


    # - name: Run Tests (notifier)
    #   working-directory: ./notifier
    #   run: go test -v ./...
