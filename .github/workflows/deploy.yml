name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.web
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest

      - name: Build and Push Bot
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.bot
          push: true
          tags: ghcr.io/${{ github.repository }}/bot:latest

      - name: Build and Push Notifier
        uses: docker/build-push-action@v5
        with:
          context: .
          file: notifier/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/notify:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_PROJECT_DIR || '/home/user/split-core' }}
            docker compose pull
            docker compose up -d
