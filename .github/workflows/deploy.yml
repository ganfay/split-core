name: Build and Deploy

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.web
          push: true
          tags: |
            ghcr.io/ganfay/split-core/web:latest
            ghcr.io/ganfay/split-core/web:1.2.0

      - name: Build and Push Bot
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile.bot
          push: true
          tags: |
            ghcr.io/ganfay/split-core/bot:latest
            ghcr.io/ganfay/split-core/bot:1.2.0

      - name: Build and Push Notifier
        uses: docker/build-push-action@v5
        with:
          context: .
          file: notifier/Dockerfile
          push: true
          tags: |
            ghcr.io/ganfay/split-core/notify:latest
            ghcr.io/ganfay/split-core/notify:1.2.0

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_BOT_NAME=${{ secrets.BOT_NAME }}
          tags: |
            ghcr.io/ganfay/split-core/frontend:latest
            ghcr.io/ganfay/split-core/frontend:1.2.0

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_PROJECT_DIR || '/home/user/split-core' }}
            git pull
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi
            docker compose --env-file backend/.env -f docker-compose.prod.yaml pull
            docker compose --env-file backend/.env -f docker-compose.prod.yaml --profile tools run --rm migrate
            docker compose --env-file backend/.env -f docker-compose.prod.yaml up -d
            docker image prune -f
