services:
  frontend:
    image: ghcr.io/ganfay/split-core/frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BOT_NAME: ${BOT_NAME:-SplitCoreBot}
    container_name: split_core_frontend
    restart: always
    init: true
    stop_signal: SIGQUIT
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db:
    image: postgres:18.3-bookworm
    container_name: split_core_db
    restart: always
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.19.1
    user: "${UID:-1000}:${GID:-1000}"
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/internal/repository/postgres_migrations:/migrations
    command:
      [
        "-source",
        "file:///migrations",
        "-database",
        "postgresql://${PG_USER}:${PG_PASS}@db:${PG_PORT:-5432}/${PG_DB}?sslmode=disable",
        "up"
      ]

  web:
    image: ghcr.io/ganfay/split-core/web:latest
    build:
      context: .
      dockerfile: backend/Dockerfile.web
    container_name: split_core_web
    restart: always
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: backend/.env
        required: false
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/out/web:/app/out
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TOKEN: ${TOKEN}
      BOT_NAME: ${BOT_NAME}
      BOT_VER: ${BOT_VER:-1.2.0}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
      PG_DB: ${PG_DB}
      ENV: ${ENV:-local}
      PG_HOST: db
      PG_PORT: ${PG_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASS: ${REDIS_PASS}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_USER: ${RMQ_USER}
      GRPC_PORT: ${GRPC_PORT:-:50001}
      JWT_SECRET_ACCESS: ${JWT_SECRET_ACCESS}
      JWT_SECRET_REFRESH: ${JWT_SECRET_REFRESH}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    image: ghcr.io/ganfay/split-core/bot:latest
    build:
      context: .
      dockerfile: backend/Dockerfile.bot
    container_name: split_core_app
    restart: always
    init: true
    stop_grace_period: 25s
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/out/bot:/app/out
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      TOKEN: ${TOKEN}
      BOT_NAME: ${BOT_NAME}
      BOT_VER: ${BOT_VER:-1.2.0}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
      PG_DB: ${PG_DB}
      ENV: ${ENV:-local}
      PG_HOST: db
      PG_PORT: ${PG_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASS: ${REDIS_PASS}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_USER: ${RMQ_USER}
      GRPC_PORT: ${GRPC_PORT:-:50001}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 \"$${GRPC_PORT#:}\" || nc -z ::1 \"$${GRPC_PORT#:}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.6.2-alpine
    container_name: split_core_redis
    restart: always
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASS}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  split-notify:
    image: ghcr.io/ganfay/split-core/notify:latest
    container_name: split_notify
    restart: always
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: notifier/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      bot:
        condition: service_healthy
    environment:
      ENV: ${ENV:-local}
      GRPC_PORT: ${GRPC_PORT:-:50001}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_USER: ${RMQ_USER}

  rabbitmq:
    image: rabbitmq:4.3.2-management
    container_name: split-rabbit
    restart: always
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

networks:
  default:
    name: split_network

volumes:
  pgdata:
  redisdata:
