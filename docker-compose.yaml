services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BOT_NAME: ${BOT_NAME}
    container_name: split_core_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      web:
        condition: service_started
  db:
    image: postgres:18.3-bookworm
    container_name: split_core_db
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile.web
    container_name: split_core_web
    restart: always
    env_file:
      - backend/.env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    volumes:
      - ${PROJECT_ROOT}/backend/out/web:/app/out
    user: "${UID}:${GID}"
    environment:
      TOKEN: ${TOKEN}
      BOT_NAME: ${BOT_NAME}
      BOT_VER: ${BOT_VER}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
      PG_DB: ${PG_DB}
      ENV: ${ENV:-local}

      PG_HOST: db
      REDIS_HOST: redis

      PG_PORT: ${PG_PORT}
      REDIS_PORT: ${REDIS_PORT}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_USER: ${RMQ_USER}
      GRPC_PORT: ${GRPC_PORT}
  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile.bot
    container_name: split_core_app
    restart: always
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
    volumes:
      - ${PROJECT_ROOT}/backend/out/bot:/app/out
    user: "${UID}:${GID}"
    environment:
      TOKEN: ${TOKEN}
      BOT_NAME: ${BOT_NAME}
      BOT_VER: ${BOT_VER}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
      PG_DB: ${PG_DB}
      ENV: ${ENV:-local}

      PG_HOST: db
      REDIS_HOST: redis

      PG_PORT: ${PG_PORT}
      REDIS_PORT: ${REDIS_PORT}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_USER: ${RMQ_USER}
      GRPC_PORT: ${GRPC_PORT}
  migrate:
    image: migrate/migrate:v4.19.1
    user: "${UID}:${GID}"
    volumes:
      - ${PROJECT_ROOT}/backend/internal/repository/postgres_migrations:/migrations
  redis:
    image: redis:8.6.2-alpine
    container_name: split_core_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASS}
    command: >
      redis-server
      --requirepass ${REDIS_PASS}
      --appendonly yes
  split-notify:
    container_name: split_notify
    restart: always
    build:
      context: .
      dockerfile: notifier/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_started
    environment:
      ENV: ${ENV:-local}
      GRPC_PORT: ${GRPC_PORT}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_USER: ${RMQ_USER}
  rabbitmq:
    image: rabbitmq:4.3.2-management
    container_name: split-rabbit
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS}
networks:
  default:
    name: split_network

volumes:
  pgdata:
  redisdata:
