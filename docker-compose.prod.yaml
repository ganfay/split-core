services:
  caddy:
    image: caddy:2.10-alpine
    container_name: split_core_caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  frontend:
    image: ghcr.io/ganfay/split-core/frontend:${IMAGE_TAG:-latest}
    container_name: split_core_frontend
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  web:
    image: ghcr.io/ganfay/split-core/web:${IMAGE_TAG:-latest}
    container_name: split_core_web
    restart: unless-stopped
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/out/web:/app/out
    environment:
      TOKEN: ${TOKEN}
      BOT_NAME: ${BOT_NAME}
      BOT_VER: ${BOT_VER:-1.2.0}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
      PG_DB: ${PG_DB}
      PG_HOST: db
      PG_PORT: ${PG_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASS: ${REDIS_PASS}
      RMQ_USER: ${RMQ_USER}
      RMQ_PASS: ${RMQ_PASS}
      GRPC_PORT: ${GRPC_PORT:-:50001}
      ENV: ${ENV:-production}
      JWT_SECRET_ACCESS: ${JWT_SECRET_ACCESS}
      JWT_SECRET_REFRESH: ${JWT_SECRET_REFRESH}

  bot:
    image: ghcr.io/ganfay/split-core/bot:${IMAGE_TAG:-latest}
    container_name: split_core_bot
    restart: unless-stopped
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/out/bot:/app/out
    environment:
      TOKEN: ${TOKEN}
      BOT_NAME: ${BOT_NAME}
      BOT_VER: ${BOT_VER:-1.2.0}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
      PG_DB: ${PG_DB}
      PG_HOST: db
      PG_PORT: ${PG_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASS: ${REDIS_PASS}
      RMQ_USER: ${RMQ_USER}
      RMQ_PASS: ${RMQ_PASS}
      GRPC_PORT: ${GRPC_PORT:-:50001}
      ENV: ${ENV:-production}
      JWT_SECRET_ACCESS: ${JWT_SECRET_ACCESS}
      JWT_SECRET_REFRESH: ${JWT_SECRET_REFRESH}

  split-notify:
    image: ghcr.io/ganfay/split-core/notify:${IMAGE_TAG:-latest}
    container_name: split_notify
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      ENV: ${ENV:-production}
      GRPC_PORT: ${GRPC_PORT:-:50001}
      RMQ_USER: ${RMQ_USER}
      RMQ_PASS: ${RMQ_PASS}

  db:
    image: postgres:18.3-bookworm
    container_name: split_core_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:8.6.2-alpine
    container_name: split_core_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASS}
      --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASS} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 8

  rabbitmq:
    image: rabbitmq:4.3.2-management
    container_name: split_core_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  migrate:
    image: migrate/migrate:v4.19.1
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/internal/repository/postgres_migrations:/migrations:ro
    command:
      [
        "-source",
        "file:///migrations",
        "-database",
        "postgresql://${PG_USER}:${PG_PASS}@db:${PG_PORT:-5432}/${PG_DB}?sslmode=disable",
        "up"
      ]

networks:
  default:
    name: split_prod_network

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  caddy_data:
  caddy_config:
