services:
  caddy:
    image: caddy:2.10-alpine
    container_name: split_core_caddy
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    depends_on:
      frontend:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:?FRONTEND_DOMAIN is required}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:?BACKEND_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/ganfay/split-core/frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: split_core_frontend
    restart: unless-stopped
    init: true
    stop_signal: SIGQUIT
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  web:
    image: ghcr.io/ganfay/split-core/web:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: split_core_web
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/out/web:/app/out
    environment:
      TOKEN: ${TOKEN:?TOKEN is required}
      BOT_NAME: ${BOT_NAME:?BOT_NAME is required}
      BOT_VER: ${BOT_VER:-1.2.0}
      PG_USER: ${PG_USER:?PG_USER is required}
      PG_PASS: ${PG_PASS:?PG_PASS is required}
      PG_DB: ${PG_DB:?PG_DB is required}
      PG_HOST: db
      PG_PORT: ${PG_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASS: ${REDIS_PASS:?REDIS_PASS is required}
      RMQ_USER: ${RMQ_USER:?RMQ_USER is required}
      RMQ_PASS: ${RMQ_PASS:?RMQ_PASS is required}
      GRPC_PORT: ${GRPC_PORT:-:50001}
      ENV: ${ENV:-production}
      JWT_SECRET_ACCESS: ${JWT_SECRET_ACCESS:?JWT_SECRET_ACCESS is required}
      JWT_SECRET_REFRESH: ${JWT_SECRET_REFRESH:?JWT_SECRET_REFRESH is required}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    image: ghcr.io/ganfay/split-core/bot:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: split_core_bot
    restart: unless-stopped
    init: true
    stop_grace_period: 25s
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: backend/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/out/bot:/app/out
    environment:
      TOKEN: ${TOKEN:?TOKEN is required}
      BOT_NAME: ${BOT_NAME:?BOT_NAME is required}
      BOT_VER: ${BOT_VER:-1.2.0}
      PG_USER: ${PG_USER:?PG_USER is required}
      PG_PASS: ${PG_PASS:?PG_PASS is required}
      PG_DB: ${PG_DB:?PG_DB is required}
      PG_HOST: db
      PG_PORT: ${PG_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASS: ${REDIS_PASS:?REDIS_PASS is required}
      RMQ_USER: ${RMQ_USER:?RMQ_USER is required}
      RMQ_PASS: ${RMQ_PASS:?RMQ_PASS is required}
      GRPC_PORT: ${GRPC_PORT:-:50001}
      ENV: ${ENV:-production}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 \"$${GRPC_PORT#:}\" || nc -z ::1 \"$${GRPC_PORT#:}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  split-notify:
    image: ghcr.io/ganfay/split-core/notify:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: split_notify
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    depends_on:
      rabbitmq:
        condition: service_healthy
      bot:
        condition: service_healthy
    environment:
      ENV: ${ENV:-production}
      GRPC_PORT: ${GRPC_PORT:-:50001}
      RMQ_USER: ${RMQ_USER:?RMQ_USER is required}
      RMQ_PASS: ${RMQ_PASS:?RMQ_PASS is required}

  db:
    image: postgres:18.3-bookworm
    container_name: split_core_db
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${PG_USER:?PG_USER is required}
      POSTGRES_PASSWORD: ${PG_PASS:?PG_PASS is required}
      POSTGRES_DB: ${PG_DB:?PG_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  redis:
    image: redis:8.6.2-alpine
    container_name: split_core_redis
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    environment:
      REDISCLI_AUTH: ${REDIS_PASS:?REDIS_PASS is required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.3.2-management
    container_name: split_core_rabbitmq
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER:?RMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS:?RMQ_PASS is required}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  migrate:
    image: migrate/migrate:v4.19.1
    profiles:
      - tools
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/internal/repository/postgres_migrations:/migrations:ro
    command:
      [
        "-source",
        "file:///migrations",
        "-database",
        "postgresql://${PG_USER:?PG_USER is required}:${PG_PASS:?PG_PASS is required}@db:${PG_PORT:-5432}/${PG_DB:?PG_DB is required}?sslmode=disable",
        "up"
      ]

networks:
  default:
    name: split_prod_network

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  caddy_data:
  caddy_config:
